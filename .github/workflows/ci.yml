name: ExtractPDF v2 foundation

on:
  push:
    branches:
      - refactor/v2-modern-mupdf
  pull_request:

permissions:
  contents: read

concurrency:
  group: extractpdf-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MuPDF 1.28.2
        shell: bash
        run: |
          git clone --branch 1.28.2 --depth 1 --recurse-submodules https://github.com/ArtifexSoftware/mupdf.git "$RUNNER_TEMP/mupdf"
          make -C "$RUNNER_TEMP/mupdf" -j2 build=release HAVE_LIBCRYPTO=no libs

      - name: Configure static build
        run: cmake -S . -B build -DMUPDF_ROOT="$RUNNER_TEMP/mupdf" -DBUILD_SHARED_LIBS=OFF

      - name: Build static library and tests
        run: cmake --build build --parallel 2

      - name: Test static build
        run: ctest --test-dir build --output-on-failure

      - name: Configure sanitizer build
        shell: bash
        run: |
          cmake -S . -B build-asan \
            -DMUPDF_ROOT="$RUNNER_TEMP/mupdf" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitizer configuration
        run: cmake --build build-asan --parallel 2

      - name: Test sanitizer configuration
        run: ctest --test-dir build-asan --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MuPDF 1.28.2
        shell: bash
        run: |
          git clone --branch 1.28.2 --depth 1 --recurse-submodules https://github.com/ArtifexSoftware/mupdf.git "$RUNNER_TEMP/mupdf"
          make -C "$RUNNER_TEMP/mupdf" -j2 build=release HAVE_LIBCRYPTO=no libs

      - name: Configure
        run: cmake -S . -B build -DMUPDF_ROOT="$RUNNER_TEMP/mupdf" -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install static MuPDF 1.28.2 with vcpkg
        shell: pwsh
        run: |
          vcpkg install libmupdf:x64-windows-static --overlay-ports="$env:GITHUB_WORKSPACE\vcpkg-ports"

      - name: Configure ExtractPDF DLL
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE\vcpkg-ports" `
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
